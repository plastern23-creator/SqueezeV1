name: Build Squeeze Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/android

      - name: Build Web Assets
        run: npx vite build

      - name: Generate and Sync Fresh Android Platform
        run: |
          rm -rf android
          npx --yes @capacitor/cli add android
          npx --yes @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: squeeze-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
